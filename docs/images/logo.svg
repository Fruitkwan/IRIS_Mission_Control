<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>IRIS Mission Control</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b26"/>
      <stop offset="1" stop-color="#062a2c"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Mission-control dial: an open gauge arc -->
  <path d="M150 362 A150 150 0 1 1 362 362" fill="none" stroke="url(#dial)" stroke-width="30" stroke-linecap="round"/>
  <!-- IRIS Doctor: heartbeat pulse through the dial -->
  <path d="M104 276 H200 L230 200 L270 340 L302 240 L322 276 H408" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Healthy reading -->
  <circle cx="256" cy="402" r="18" fill="#2dd4bf"/>
</svg>
