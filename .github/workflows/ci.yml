name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Rule engine, scoring and collector tests
        run: npm test
      - name: Type-check and production build
        run: npm run build

  mcp:
    name: MCP server — test and boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - name: Secret redaction tests
        run: npm test
      - name: Boot smoke test (shared rules engine resolves, tools are registered)
        run: |
          MCP_PORT=3333 npm start > mcp.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:3333/tools > tools.json && break; sleep 1; done
          cat mcp.log
          grep -q iris_get_health tools.json

  docker:
    name: Docker — full stack healthcheck
    runs-on: ubuntu-latest
    needs: [frontend, mcp]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start IRIS + portal + MCP
        run: docker compose up -d --build
      - name: Wait for the IRIS container healthcheck
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' irisops)
            echo "irisops: $status"
            [ "$status" = healthy ] && exit 0
            sleep 10
          done
          exit 1
      - name: Portal, SysAdmin API and MCP respond
        run: |
          curl -fsS http://localhost:52773/irisops/ | grep -q '<div id="root">'
          curl -fsS -u _SYSTEM:SYS http://localhost:52773/api/admin/info
          curl -fsS http://localhost:3333/status | tee status.json
          grep -q '"iris":"connected"' status.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
