services:
  iris:
    build:
      context: .
    container_name: irisops
    # Start IRIS directly instead of through the entrypoint's first-boot hook
    # (iris-after-start), which fails fatally on an upstream dbapi regression and
    # fails again whenever the container is recreated. This image does not need
    # the hook: everything is installed at build time. See issue #3.
    command: /iris-main --check-caps false --ISCAgent false
    # The entrypoint normally runs iris-main from the home folder (iris-main.log).
    working_dir: /home/irisowner
    restart: unless-stopped
    environment:
      IRISOPS_SSL_CONFIG: ${IRISOPS_SSL_CONFIG:-}
    ports:
      - "52773:52773"
      - "1972:1972"
    volumes:
      - irisops-data:/usr/irissys/mgr
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/52773 && echo -e \"GET /irisops/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

  mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: irisops-mcp
    restart: unless-stopped
    environment:
      IRIS_URL: http://iris:52773/api/admin
      IRIS_USER: ${IRIS_USER:-_SYSTEM}
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
      MCP_PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      iris:
        condition: service_started

volumes:
  irisops-data:
